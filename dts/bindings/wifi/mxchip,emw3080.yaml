description: MXCHIP EMW3080 Wi-Fi module

compatible: "mxchip,emw3080"

include: spi-device.yaml

properties:
  enable-gpios:
    type: phandle-array
    required: true
    description: GPIO used to enable the Wi-Fi module.

  flow-gpios:
    type: phandle-array
    required: true
    description: GPIO indicating the module is ready for an SPI transfer.

  notify-gpios:
    type: phandle-array
    required: true
    description: GPIO indicating the module has data available.
