# Stacks
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# WiFi
CONFIG_SPI=y
CONFIG_WIFI=y
CONFIG_EMW3080=y
CONFIG_EMW3080_LOG_LEVEL_DBG=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=n
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
